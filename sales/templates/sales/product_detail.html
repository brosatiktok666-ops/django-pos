<!DOCTYPE html>
<html>
<head>
    <title>ព័ត៌មានលម្អិតផលិតផល</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="card shadow">
        <div class="card-body">
            <!-- ១. ឈ្មោះផលិតផល និង badge ប្រភេទ -->
            <h2 class="card-title">
                {{ product.name }} 
                <span class="badge bg-primary">{{ product.category }}</span>
            </h2>
            <hr>

            <!-- ២. តម្លៃ -->
            <p class="fs-4 text-success">តម្លៃ: ${{ product.price }}</p>

            <!-- ៣. Barcode -->
            <p class="text-muted">Barcode: {{ product.barcode }}</p>

            <!-- ៤. កម្រិតស្តុក (បង្ហាញការព្រមានប្រសិនបើស្តុក < 10) -->
            <div class="mt-3">
                ស្តុកបច្ចុប្បន្ន: <strong>{{ product.stock }}</strong>
                
                {% if product.stock < 10 %}
                    <div class="alert alert-warning mt-2" role="alert">
                        ⚠️ ការព្រមាន៖ ស្តុកនៅសល់ទាប!
                    </div>
                {% endif %}
            </div>

            <!-- ៥. តំណ "← ត្រឡប់ទៅបញ្ជីផលិតផល" -->
            <div class="mt-4">
                <a href="/sales/products/" class="btn btn-outline-secondary">
                    ← ត្រឡប់ទៅបញ្ជីផលិតផល
                </a>
            </div>
        </div>
    </div>

</body>
</html>
